# Builds the image stamped with the commit and smoke-tests it. The real deploy step runs only if
# a deploy secret is present, so the pipeline is honest on a fresh checkout: it proves the build
# and the /version stamp, and wires the deploy without pretending one is configured.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image (stamped with the commit)
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "acme-billing-mock:${GITHUB_SHA}" .

      - name: Smoke test the built image
        run: |
          docker run -d --name target -p 127.0.0.1:3000:3000 "acme-billing-mock:${GITHUB_SHA}"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/healthz && break; sleep 1; done
          sha="$(curl -fsS http://127.0.0.1:3000/version | sed -n 's/.*"gitSha":"\([^"]*\)".*/\1/p')"
          echo "deployed sha: $sha"
          test "$sha" = "${GITHUB_SHA}"   # /version must report the commit we built
          docker rm -f target

      # Real deploy. Fill in for your host (Fly.io / Render / Railway / a small VM) and set the
      # secret. Skipped automatically when the secret is absent, so this file never fails a fresh
      # repo. Example shape only:
      - name: Deploy
        if: ${{ secrets.DEPLOY_TOKEN != '' }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "TODO: push acme-billing-mock:${GITHUB_SHA} to your host and pass GIT_SHA=${GITHUB_SHA}"
          echo "After deploy, run the exploit script against the public URL to confirm live state."
