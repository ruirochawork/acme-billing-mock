# Step 7: on merge to main, build the image once, publish it to GHCR tagged by commit, deploy it
# to QA, and verify QA is up and running exactly that commit. The published digest is the artifact
# everything downstream promotes — production never rebuilds from source.
#
# Deploy + verify run only when the QA_URL variable is set, so a fresh repo still builds and
# publishes green before any hosting exists. Wire deploy/deploy.sh and set QA_URL to activate them.
name: deliver

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # push to GHCR

jobs:
  build-publish-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_URL: ${{ vars.QA_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Compute image name (GHCR requires lowercase)
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/acme-billing-mock" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # QEMU + buildx let the amd64 runner cross-build an arm64 image for the Oracle A1 (Arm) box.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch (amd64 + arm64), tagged by sha and latest
        id: build
        run: |
          IMAGE="${{ steps.img.outputs.image }}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" --push .
          # The manifest-list digest: pulling image@<this> on any host resolves the right arch.
          listdigest="$(docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          echo "digest=$IMAGE@$listdigest" >> "$GITHUB_OUTPUT"
          echo "deployable digest: $IMAGE@$listdigest"

      # Deploy is pull-based: a Watchtower container on the QA box watches the :latest tag and
      # updates the app within its poll interval. CI stores no key and never connects to the box;
      # it just waits for QA to report this commit, then records the finding state (report-only).
      - name: Wait for QA to pick up this build, then check the finding
        if: env.QA_URL != ''
        run: |
          for i in $(seq 1 30); do
            sha="$(curl -fsS "$QA_URL/version" | sed -n 's/.*"gitSha":"\([^"]*\)".*/\1/p' || true)"
            [ "$sha" = "${GITHUB_SHA}" ] && { echo "QA is on ${GITHUB_SHA}"; break; }
            echo "waiting for QA to report ${GITHUB_SHA} (currently ${sha:-unreachable})..."
            sleep 10
          done
          node security/exploit/access-control.mjs --url "$QA_URL" || true
