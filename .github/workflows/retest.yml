# Runs on every pull request: the fix must make the exploit fail while the control still passes,
# and the app's own tests must stay green. This is the gate that proves a proposed fix on the
# running service before anyone merges it — the genuine red->green signal for the demo.
name: retest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: App invariants
        run: npm test

      - name: Start the PR build
        run: |
          HOST=127.0.0.1 PORT=3000 node src/server.js &
          echo "PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/healthz && break; sleep 1; done

      # Expect the fix: attack blocked (403), control still 200, negative still 401. A BROKEN or
      # still-EXPLOITABLE verdict fails the job and blocks the merge.
      - name: Prove the fix on the running service
        run: node security/exploit/access-control.mjs --url http://127.0.0.1:3000 --expect fixed

      - name: Stop the service
        if: always()
        run: kill "${PID#PID=}" 2>/dev/null || true
