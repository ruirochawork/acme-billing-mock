# Step 6: the merge gate. On every PR, the app's tests must pass and the exploit must observe the
# fix — attack blocked (403), control still 200, negative still 401. A BROKEN or still-EXPLOITABLE
# verdict fails the job and blocks the merge. This is the genuine red->green signal of the demo.
name: retest-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: App invariants
        run: npm test

      - name: Start the PR build
        run: |
          HOST=127.0.0.1 PORT=3000 node src/server.js &
          echo "PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/healthz && break; sleep 1; done

      - name: Prove the fix (attack 403, control 200, negative 401)
        run: node security/exploit/access-control.mjs --url http://127.0.0.1:3000 --expect fixed

      - name: Stop the service
        if: always()
        run: kill "${PID#PID=}" 2>/dev/null || true
